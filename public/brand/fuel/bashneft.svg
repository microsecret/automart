<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Башнефть">
  <!-- Знак Башнефти: круг, рассечённый «птичкой» из центра.
       Левый и правый нижние сектора зелёные, верхний клин малиновый,
       между ними белые просветы. -->
  <circle cx="32" cy="32" r="31" fill="#0f9d4f"/>
  <!-- Верхний малиновый клин: от центра к верхним краям круга. -->
  <path d="M32 34 L2 10 A31 31 0 0 1 62 10 Z" fill="#c90a68"/>
  <!-- Белая «птичка»: два луча из центра вверх-влево и вверх-вправо. -->
  <path d="M32 36 L3.5 15 L8 8.5 L32 26 L56 8.5 L60.5 15 Z" fill="#fff"/>
  <!-- Белый луч вниз: делит нижнюю зелёную часть надвое. -->
  <path d="M28.5 33 h7 V63 h-7 Z" fill="#fff"/>
</svg>
