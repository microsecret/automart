[Service]
# Override the legacy public listener. Port 4000 is served by Nginx, while
# Next.js accepts traffic only from that local proxy on port 4001.
#
# Start the Next.js CLI directly instead of through npm.  With `npm run start`
# systemd supervises the npm wrapper and can leave the actual Node process
# alive during a deployment; this is what creates a transient 502 window at
# the proxy.  A direct main process makes the stop/restart sequence reliable.
ExecStart=
ExecStart=/usr/bin/node /root/AutoMart/node_modules/next/dist/bin/next start -p 4001 -H 127.0.0.1
Restart=always
RestartSec=3
TimeoutStartSec=45
TimeoutStopSec=15
KillSignal=SIGTERM
KillMode=mixed
