# Public AutoMart entry point. Next.js is deliberately bound to loopback only;
# this proxy owns the external port and supplies a trusted client IP.
server {
    listen 4000;
    listen [::]:4000;
    server_name _;

    # Align the proxy envelope with the API's 10 MiB file limit.
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not forward a browser-supplied chain: rate limiting must use the
        # actual peer connected to this proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }
}
