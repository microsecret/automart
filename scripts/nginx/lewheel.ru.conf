# lewheel.ru public entry point for AutoMart.
#
# Install to /etc/nginx/conf.d/lewheel.ru.conf and validate with `nginx -t`.
# The Let's Encrypt certificate must exist before this TLS configuration is
# activated; Certbot renewals retain the same paths.
server {
    listen 80;
    listen [::]:80;
    server_name lewheel.ru www.lewheel.ru;

    # Let's Encrypt HTTP-01 validation must bypass the application proxy.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://lewheel.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lewheel.ru www.lewheel.ru;

    ssl_certificate /etc/letsencrypt/live/lewheel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lewheel.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # A secure visit is remembered only after a valid TLS handshake.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Keep a single canonical host for sessions, callbacks and shared links.
    if ($host = www.lewheel.ru) {
        return 301 https://lewheel.ru$request_uri;
    }

    # Matches the API upload limit and keeps oversized request bodies outside
    # the Node process.
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Never trust a client-provided forwarding chain for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }
}
