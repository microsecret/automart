# lewheel.ru public entry point for AutoMart.
#
# Install to /etc/nginx/conf.d/lewheel.ru.conf, validate with `nginx -t`, and
# enable TLS with Certbot after both DNS records resolve to the server. Until
# then the application remains available via HTTP; do not redirect to HTTPS
# before the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name lewheel.ru www.lewheel.ru;

    # Let's Encrypt HTTP-01 validation must bypass the application proxy.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Matches the API upload limit and keeps oversized request bodies outside
    # the Node process.
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Never trust a client-provided forwarding chain for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }
}
