# Temporary containment for the existing local SQLite database, not a migration.
# Install as /run/systemd/system/automart.service.d/zz-sqlite-pool.conf.
# Existing EnvironmentFile and service settings remain in effect.
[Service]
ExecStart=
ExecStart=/usr/bin/env "DATABASE_URL=file:./dev.db?connection_limit=1&socket_timeout=5&pool_timeout=5" /usr/bin/node /root/AutoMart/node_modules/next/dist/bin/next start -p 4001 -H 127.0.0.1
